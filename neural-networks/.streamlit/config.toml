[theme]
# Primary accent color for interactive elements
primaryColor = "#7792E3"  # Medium blue-purple for main accents

# Background color for the main content area
backgroundColor = "#FFFFFF"  # Clean white background

# Background color for sidebar and most interactive widgets
secondaryBackgroundColor = "#F0F2F6"  # Light gray-blue for contrast

# Color used for almost all text
textColor = "#262730"  # Dark gray for readability

# Font family for all text in the app, except code blocks
font = "sans-serif"

[server]
# If the app is run without a proper header, this will be used
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
# Whether to automatically open the browser when the server starts
serverAddress = "localhost"
serverPort = 8501
gatherUsageStats = false 